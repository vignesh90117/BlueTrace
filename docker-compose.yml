version: '3.8'

services:
  bluetrace:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bluetrace-registry
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/projects || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
